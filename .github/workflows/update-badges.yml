name: Update download badges

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-download-badges
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate badge SVGs
        run: node scripts/update-badges.mjs

      - name: Commit refreshed badges
        run: |
          if [ -z "$(git status --porcelain assets/readme)" ]; then
            echo "Badges already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/readme
          git commit -m "chore(readme): refresh download badges"
          git push
